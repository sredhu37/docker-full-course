name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.2.0
        with:
          node-version: 24

      - uses: actions/cache@v5.0.3
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: ${{ runner.os }}-nodemodules-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nodemodules-

      - uses: actions/cache@v5.0.3
        id: next-cache # use this to check for `cache-hit` ==> if: steps.next-cache.outputs.cache-hit != 'true'
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: Dockerfile.ci
          push: false
          tags: docker-demo:with-cache
